<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  
  <title>Frontend Mentor | Order summary card</title>
  <link rel="stylesheet" href="./style.css">

</head>
<body>

  <div class="parent">
    <div class="image">
      <img id="img1" src="./illustration-hero.svg">
    </div>

    <h2>Order Summary</h2>
    <p id="p1">You can now listen to millions of songs, audiobooks, and podcasts on any 
  device anywhere you like!</p>

    <div class="num">
      <img id="img2" src="./icon-music.svg">
      <p id="p2">Annual Plan</p>
      <p id="p3">$59.99/year</p>
      <a href="#">Change</a>
    </div>

    <button id="b1">Proceed to Payment</button>
    <button id="b2">Cancel Order </button>
  </div>
</body>
</html>
